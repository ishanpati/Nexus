name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "1"

jobs:
  windows:
    name: Windows checks
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Verify Windows build prerequisites
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $visualStudio) {
            throw 'The Windows runner must provide the MSVC x64 C++ build tools.'
          }
          Write-Output "MSVC installation: $visualStudio"
          foreach ($command in @('node', 'npm.cmd', 'rustc', 'cargo')) {
            & $command --version
            if ($LASTEXITCODE -ne 0) { throw "Could not run $command" }
          }

      - name: Install locked npm dependencies
        run: npm.cmd ci --no-audit --no-fund

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test frontend
        run: npm.cmd test

      - name: Typecheck and build frontend
        run: npm.cmd run build

      # Existing style warnings remain visible; Clippy errors fail this step.
      - name: Check Rust with Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets

      # Never pass --ignored or --include-ignored: live audio is opt-in.
      # Lock/sleep coverage uses fake operations, not native system transitions.
      - name: Test Rust targets
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Test Rust documentation
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --doc

      # Compile embedded assets through the real Tauri configuration, without installers.
      - name: Build Windows application
        run: npm.cmd run tauri build -- --debug --no-bundle -- --locked
